[variables]
NIXPACKS_PNPM_VERSION = "10"
NIXPACKS_NO_CACHE = "1"
# Pin >= 22.12 — Vite 7 requires Node "^20.19.0 || >=22.12.0"; the bare "22"
# resolved to 22.11.0 on the builder, which is BELOW that floor (build warning
# today, hard failure on a future Vite). 22.12 is the first 22.x that satisfies it.
NIXPACKS_NODE_VERSION = "22.12.0"

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["rm -rf artifacts/mymonastery/dist artifacts/letters-app/dist", "pnpm --filter @workspace/mymonastery run build", "BASE_PATH=/mail pnpm --filter @workspace/letters-app run build", "pnpm --filter @workspace/api-server run build"]

[start]
# Schema is created/updated idempotently by migrate() on boot (api-server
# index.ts) — that is the ONLY schema mechanism, and it's CI-guarded so every
# Drizzle table has a CREATE (scripts/check-migrate-schema.mjs). Do NOT run
# `drizzle-kit push --force` here: with devDeps installed it actually executes,
# applying the schema destructively (can DROP columns) against prod every deploy.
#
# The bell scheduler (daily office reminders, contemplation nudges, every
# cron-based push) runs in THIS web process by default — app.ts boots it unless
# DISABLE_BELL_SCHEDULER=true or RUN_SCHEDULERS_IN_WORKER=true. We no longer
# pass an env prefix here: a `VAR=value cmd` prefix isn't guaranteed to be
# honored by the runner, and relying on it left the scheduler silent in prod
# (the original "no morning reminders" bug). If a dedicated worker service is
# ever added, set RUN_SCHEDULERS_IN_WORKER=true on this web service.
cmd = "node ./artifacts/api-server/dist/index.mjs"
