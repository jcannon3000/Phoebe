[variables]
NIXPACKS_PNPM_VERSION = "10"
NIXPACKS_NO_CACHE = "1"
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["rm -rf artifacts/mymonastery/dist artifacts/letters-app/dist", "pnpm --filter @workspace/mymonastery run build", "BASE_PATH=/mail pnpm --filter @workspace/letters-app run build", "pnpm --filter @workspace/api-server run build"]

[start]
# Schema is created/updated idempotently by migrate() on boot (api-server
# index.ts) — that is the ONLY schema mechanism, and it's CI-guarded so every
# Drizzle table has a CREATE (scripts/check-migrate-schema.mjs). Do NOT run
# `drizzle-kit push --force` here: with devDeps installed it actually executes,
# applying the schema destructively (can DROP columns) against prod every deploy.
#
# RUN_SCHEDULERS_IN_WEB=true makes this single web process also run the bell
# scheduler (app.ts) — the source of the daily office reminders, contemplation
# nudges, and every other cron-based push. This deploy runs ONLY index.mjs
# (there is no separate worker service), so WITHOUT this flag those scheduled
# pushes never fire — only real-time pushes ("prayed for you", words of
# comfort) do. If a dedicated worker service is ever added, remove this flag
# (or set DISABLE_BELL_SCHEDULER=true) so the scheduler doesn't run in both and
# double-send.
cmd = "RUN_SCHEDULERS_IN_WEB=true node ./artifacts/api-server/dist/index.mjs"
