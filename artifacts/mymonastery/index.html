<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Phoebe</title>

    <!-- Android web zoom-out. Android Chrome renders Phoebe's tuned-for-iOS
         layout cramped ("scrunched"); the user asked for it to sit at ~90%
         like a browser zoom. Tag <html> here (before paint, no flash) and a
         CSS rule applies `zoom: 0.9`. Scoped to Android web only — never the
         native shell, never iOS. -->
    <script>
      (function () {
        try {
          var isAndroid = /Android/i.test(navigator.userAgent || "");
          var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          if (isAndroid && !isNative) document.documentElement.classList.add("android-web");
        } catch (e) { /* no-op */ }
      })();
    </script>
    <meta name="description" content="Be together with Phoebe." />
    <meta name="theme-color" content="#091A10" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://withphoebe.app/" />

    <!-- Installable web app (PWA) — lets desktop (macOS "Add to Dock",
         Chrome/Edge "Install") and mobile users run Phoebe as a standalone
         windowed app, with the existing service worker + web push. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Phoebe" />

    <!-- Apple Smart App Banner — shows a thin "Get / Open" strip at the
         top of mobile Safari pointing at the App Store listing. iOS
         renders it natively for Safari users; harmless on every other
         platform. App ID is the App Store id from the listing URL. -->
    <meta name="apple-itunes-app" content="app-id=6763552921" />

    <!-- Icons. We ship a PNG rendering of the iOS app icon as the
         favicon so the browser tab + add-to-home-screen tile match
         what the user sees on iOS. The earlier SVG was a plain orange
         rectangle that didn't match the brand. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph (iMessage, Slack, WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Phoebe" />
    <meta property="og:title" content="Phoebe" />
    <meta property="og:description" content="Be together with Phoebe." />
    <meta property="og:url" content="https://withphoebe.app/" />
    <meta property="og:image" content="https://withphoebe.app/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Phoebe — a place set apart for connection" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phoebe" />
    <meta name="twitter:description" content="Be together with Phoebe." />
    <meta name="twitter:image" content="https://withphoebe.app/opengraph.jpg" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
